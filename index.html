    <script>
        // --- Global Constants and Elements ---

        // --- Core Logic (LSB Extraction - NO CHANGES) ---
        function byteize(alphaLsbArray) { /* ... */ const length = Math.floor(alphaLsbArray.length / 8) * 8; if (length === 0) return new Uint8Array(0); const truncatedLsb = alphaLsbArray.slice(0, length); const packedBytes = new Uint8Array(length / 8); for (let i = 0; i < packedBytes.length; i++) { let byte = 0; for (let j = 0; j < 8; j++) { byte |= (truncatedLsb[i * 8 + j] << (7 - j)); } packedBytes[i] = byte; } return packedBytes; }
        class LSBExtractor { /* ... */ constructor(imageData) { const width = imageData.width; const height = imageData.height; const pixelData = imageData.data; const alphaLsbColumnMajor = []; for (let x = 0; x < width; x++) { for (let y = 0; y < height; y++) { const pixelIndex = (y * width + x) * 4; const alphaValue = pixelData[pixelIndex + 3]; alphaLsbColumnMajor.push(alphaValue & 1); } } this.data = byteize(alphaLsbColumnMajor); this.pos = 0; console.log(`LSBExtractor (Column-Major): Image ${width}x${height}, Packed ${this.data.length} bytes.`); } getNextNBytes(n) { if (this.pos + n > this.data.length) { const available = this.data.length - this.pos; throw new Error(`尝试读取 ${n} 字节失败：数据不足 (需要 ${n}, 剩余 ${available})`); } const nBytes = this.data.slice(this.pos, this.pos + n); this.pos += n; return nBytes; } read32BitInteger() { const bytesList = this.getNextNBytes(4); const dataView = new DataView(bytesList.buffer, bytesList.byteOffset, bytesList.byteLength); return dataView.getUint32(0, false); } }
        function extractMetadataFromImageData(imageData) { /* ... (LSB extraction logic - unchanged) ... */ console.log("尝试 LSB 提取..."); const reader = new LSBExtractor(imageData); const magicBytes = reader.getNextNBytes(magic.length); const readMagic = new TextDecoder("utf-8").decode(magicBytes); console.log(`LSB 读取到的 Magic: "${readMagic}"`); if (magic !== readMagic) { try { const peekReader = new LSBExtractor(imageData); const firstBytes = peekReader.data.slice(0, 30); console.error("LSB 提取到的原始数据前 30 字节 (十六进制):", [...firstBytes].map(b => b.toString(16).padStart(2, '0')).join(' ')); } catch(debugErr) {} throw new Error(`LSB Magic Number 不匹配：预期 "${magic}", 得到 "${readMagic}"`); } console.log("LSB Magic Number 匹配成功！"); const readLenBits = reader.read32BitInteger(); console.log(`LSB 读取到的压缩数据长度 (bits): ${readLenBits}`); const readLenBytes = Math.ceil(readLenBits / 8); if (readLenBytes <= 0 || !Number.isInteger(readLenBytes)) { throw new Error(`LSB 读取到的数据长度无效 (${readLenBits} bits -> ${readLenBytes} bytes)。`); } console.log(`LSB 预期读取 ${readLenBytes} 字节的压缩 JSON 数据。`); const compressedJsonData = reader.getNextNBytes(readLenBytes); console.log(`LSB 成功读取 ${compressedJsonData.length} 字节的压缩数据。`); if (compressedJsonData.length < readLenBytes) { console.warn(`LSB 警告：预期读取 ${readLenBytes} 字节，但实际只读取到 ${compressedJsonData.length} 字节。解压缩可能失败。`); } console.log("LSB 使用 pako 进行 Gzip 解压缩..."); const decompressedData = pako.inflate(compressedJsonData); console.log(`LSB Gzip 解压缩成功，得到 ${decompressedData.length} 字节的数据。`); const jsonDataString = new TextDecoder("utf-8").decode(decompressedData); console.log("LSB UTF-8 解码成功。"); const jsonData = JSON.parse(jsonDataString); console.log("LSB JSON 解析成功。"); if (jsonData.Comment && typeof jsonData.Comment === 'string') { try { jsonData.Comment = JSON.parse(jsonData.Comment); console.log("LSB 成功解析内嵌的 'Comment' JSON 字符串。"); } catch (e) { console.warn("LSB 无法将 'Comment' 字段解析为 JSON，将保持其为字符串。错误:", e.message); } } let yamlData = null; try { console.log("LS         // --- Formatting Logic (NAI Specific - Modified vt check) ---
        const colMapRev = {'A': 0.1, 'B': 0.3, 'C': 0.5, 'D': 0.7, 'E': 0.9}; const rowMapRev = {'1': 0.1, '2': 0.3, '3': 0.5, '4': 0.7, '5': 0.9}; const toleranceRev = 1e-6; const defaultCoordsRev = { x: 0.5, y: 0.5 }; function isClose(a, b, tolerance) { return Math.abs(a - b) < tolerance; } function getPositionCodeRev(x, y, useCoordsFlag = true) { if (!useCoordsFlag) return ""; const isDefault = isClose(x, defaultCoordsRev.x, toleranceRev) && isClose(y, defaultCoordsRev.y, toleranceRev); if (isDefault) return ""; let foundCol = null, foundRow = null; for (const key in colMapRev) if (isClose(x, colMapRev[key], toleranceRev)) { foundCol = key; break; } for (const key in rowMapRev) if (isClose(y, rowMapRev[key], toleranceRev)) { foundRow = key; break; } return (foundCol && foundRow) ? `#${foundCol}${foundRow}` : ""; } function listsToStringStrictPairingV3(v4Prompt, v4Negative = null, baseString = "", useCoords = true) { if (!Array.isArray(v4Prompt)) { console.error("Error: v4_prompt input is not an array."); return baseString; } let pairParts = []; const negativeList = Array.isArray(v4Negative) ? v4Negative : []; for (let i = 0; i < v4Prompt.length; i++) { const promptItem = v4Prompt[i]; try { const pCaption = promptItem?.char_caption || ''; const centers = promptItem?.centers; let coords = defaultCoordsRev; if (centers && Array.isArray(centers) && centers.length > 0 && typeof centers[0] === 'object' && centers[0] !== null) { coords = { x: centers[0]?.x ?? defaultCoordsRev.x, y: centers[0]?.y ?? defaultCoordsRev.y }; } const positionCode = getPositionCodeRev(coords.x, coords.y, useCoords); const cPart = ` c=${pCaption}${positionCode}`; let ucPart = ""; if (i < negativeList.length) { const negativeItem = negativeList[i]; if (typeof negativeItem === 'object' && negativeItem !== null) { const nCaption = (negativeItem?.char_caption || '').trim(); if (nCaption) ucPart = ` uc=${nCaption}`; } } pairParts.push(cPart + ucPart); } catch (e) { console.error(`Error processing index ${i}: ${e}. Skipping this item.`); continue; } } const addedString = pairParts.join(""); let finalString = baseString || ""; const trailerMarkers = [" ntags=", " negprompt=", " neg=", " negative=", " #", " /"]; let insertPos = finalString.length; for (const marker of trailerMarkers) { try { const pos = finalString.indexOf(marker); if (pos !== -1) insertPos = Math.min(insertPos, pos); } catch (e) { console.error("Error finding marker:", e); break; } } finalString = finalString.substring(0, insertPos) + addedString + finalString.substring(insertPos); finalString = finalString.replace(/\s\s+/g, ' ').trim(); return finalString; }
        
        // --- MODIFICATION: Updated formatMetadataToText (Fix 1) ---
        function formatMetadataToText(jsonData) {
            if (!jsonData || typeof jsonData !== 'object') { return { txt: "格式化错误：输入不是有效的对象。", details: {} }; }
            
            // --- MODIFICATION START (Fix 1 & 2 Logic) ---
            // Determine the *actual* object that holds the parameters (steps, uc, etc.)
            let effectiveComment;
            if (jsonData.Comment && typeof jsonData.Comment === 'object') {
                // This is the standard LSB format, or a fallback where Comment was correctly parsed and nested.
                effectiveComment = jsonData.Comment;
                console.log("formatMetadataToText: Using nested 'Comment' object.");
            } else {
                // This is a fallback format (PNG chunk, or faked EXIF object)
                // jsonData itself *is* the comment object.
                effectiveComment = jsonData;
                console.log("formatMetadataToText: Using top-level object as 'effectiveComment'.");

            }

            try {

                const hasVibeTransfer = Array.isArray(vt) && vt.length > 0;

                let charCaptionsN = []; if (v4NegativePrompt && v4NegativePrompt.caption && Array.isArray(v4NegativePrompt.caption.char_captions)) charCaptionsN = v4NegativePrompt.caption.char_captions; if (v4Prompt && v4Prompt.caption && Array.isArray(v4Prompt.caption.char_captions)) { const charCaptions = v4Prompt.caption.char_captions; const useCoords = v4Prompt.use_coords ?? true; charCaptionsTxt = listsToStringStrictPairingV3(charCaptions, charCaptionsN, '', useCoords); charCaptionsTxt = charCaptionsTxt.replace(/(?<!u)c=/g, '\nc='); } const samplerMap = { 'k_euler': 'Euler', 'k_euler_ancestral': 'Euler a', 'k_dpmpp_2s_ancestral': 'DPM++ 2S a', 'k_dpmpp_2m': 'DPM++ 2M', 'k_dpmpp_sde': 'DPM++ SDE', 'k_dpmpp_2m_sde': 'DPM++ 2M SDE', 'ddim': 'DDIM' }; sampler = samplerMap[sampler] || 'Euler'; const sm = effectiveComment.sm; const sm_dyn = effectiveComment.sm_dyn; let naiType = ''; let allIf = ''; let allFIf = ''; 
                
                let naiVersion = 'NAI3'; // Default

                else if (source.includes('NovelAI Diffusion V4 F6E18726') || source.includes('NovelAI Diffusion V4 C1CCBA86')) { allFIf += ' nai4c'; naiVersion = 'NAI4 测试版'; } 
                else if (source.includes('NovelAI Diffusion V4 4F49EC75') || source.includes('NovelAI Diffusion V4 79F47848') || source.includes('NovelAI Diffusion V4')) { allFIf += ' nai4'; naiVersion = 'NAI4'; }

                if (usedDescriptionFallback) {

            if (!buttonElement.dataset.originalText) {
                buttonElement.dataset.originalText = buttonElement.textContent;
            }

            if (navigator.clipboard && window.isSecureContext) { // Check for secure context
                navigator.clipboard.writeText(textString).then(() => {

                }).catch(err => {

                    fallbackCopyTextToClipboard(textString, showFeedback);
                });
            } else {
                console.warn('navigator.clipboard not available or insecure context. Attempting fallback...');
                // --- Attempt 2: Fallback using document.execCommand ---
                fallbackCopyTextToClipboard(textString, showFeedback);
            }

        function fallbackCopyTextToClipboard(text, showFeedbackCallback) {

            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            textArea.style.left = '-9999px';
             textArea.style.width = '2em'; // Avoid potential rendering issues
             textArea.style.height = '2em';
             textArea.style.padding = '0';
             textArea.style.border = 'none';
             textArea.style.outline = 'none';
             textArea.style.boxShadow = 'none';
             textArea.style.background = 'transparent';
             textArea.setAttribute('readonly', ''); // Make it read-only

            document.body.appendChild(textArea);
            textArea.focus(); // Required for some browsers
            textArea.select(); // Select the text

            let success = false;
            try {
                success = document.execCommand('copy');
                if (success) {
                    console.log("Copied using document.execCommand");
                    showFeedbackCallback('已复制!', '#10b981'); // Green
                } else {

                console.error('Error during document.execCommand("copy"):', err);

            }

            document.body.removeChild(textArea);

                             const { txt: naiFormattedText } = formatMetadataToText(fakeJson);
                             const rawNaiFormattedText = naiFormattedText || ''; 
                             if (rawNaiFormattedText && !rawNaiFormattedText.includes("格式化警告")) { 
                                 const naiAttemptId = generateUniqueId('nai-attempt-exif');
                                 attemptedNaiFormatHtml += `
                                     <div class="metadata-block">
                                         <h4 class="nai-format-attempt-title">AI绘画机器人指令 (来自 EXIF):</h4>
                                         <button onclick="copyToClipboard(this, document.getElementById('${naiAttemptId}-raw').value)" class="copy-button float-right">复制文本</button>
                                         <span class="copy-feedback float-right mr-2"></span>
                                         <textarea id="${naiAttemptId}-raw" class="copy-textarea" readonly>${escapeHtml(rawNaiFormattedText)}</textarea>
                                         <pre id="${naiAttemptId}">${escapeHtml(rawNaiFormattedText)}</pre>
                                     </div>`; 
                                 dataFound = true;
                                 naiFormattedFromExif = true; // Mark success
                             }
                         }
                     }
                     // --- MODIFICATION END ---


                     // 3. Regular Fallback Blocks
                     if (sdParams) { /* ... (SD Params block - unchanged structure, uses hidden textarea) ... */ dataFound = true; const id = generateUniqueId('params'); const rawSdParams = sdParams || ''; fallbackContentHtml += ` <div class="metadata-block"> <h4 class="metadata-title">SD 参数 (parameters)</h4> <button onclick="copyToClipboard(this, document.getElementById('${id}-raw').value)" class="copy-button float-right">复制</button> <span class="copy-feedback float-right mr-2"></span> <textarea id="${id}-raw" class="copy-textarea" readonly>${escapeHtml(rawSdParams)}</textarea> <pre id="${id}">${escapeHtml(rawSdParams)}</pre> </div>`; }
                     if (sdExif && Object.keys(sdExif).length > 0) { /* ... (EXIF block - unchanged structure, uses hidden textarea) ... */ dataFound = true; const id = generateUniqueId('exif'); const formattedExifString = formatJsonForDisplay(sdExif); const highlightedExifHtml = highlightJson(formattedExifString); const rawExifJson = JSON.stringify(sdExif, null, 2); fallbackContentHtml += ` <div class="metadata-block"> <h4 class="metadata-title">EXIF(未必是咒语)</h4> <button onclick="copyToClipboard(this, document.getElementById('${id}-raw').value)" class="copy-button float-right">复制 JSON</button> <span class="copy-feedback float-right mr-2"></span> <textarea id="${id}-raw" class="copy-textarea" readonly>${escapeHtml(rawExifJson)}</textarea> <pre id="${id}">${highlightedExifHtml}</pre> </div>`; }
                     
                     // --- MODIFICATION START (Fix 2) ---
                     if (sdPngText && Object.keys(sdPngText).length > 0) {
                         const pngTextId = generateUniqueId('pngtext'); 
                         let chunksPreContent = ''; 
                         let contentAdded = false; 
                         for (const key in sdPngText) {
                             // --- REMOVED FILTERING LOGIC ---
                             // Always show all PNG text chunks
                             // --- END REMOVAL ---

                             const value = sdPngText[key]; 
                             let valueDisplay = ''; 
                             let isJson = false;
                             if (typeof value === 'string' && value.trim().startsWith('{') && value.trim().endsWith('}')) { 
                                 try { 
                                     const parsedJson = JSON.parse(value);
                                     valueDisplay = `<pre>${highlightJson(JSON.stringify(parsedJson, null, 2))}</pre>`;
                                     isJson = true;
                                 } catch (e) {
                                     // Not valid JSON, treat as string
                                     valueDisplay = escapeHtml(value);
                                 } 
                             } else {
                                 valueDisplay = escapeHtml(value);
                             }
                             
                             chunksPreContent += `<strong>${escapeHtml(key)}:</strong>\n<div class="chunk-value">${valueDisplay}</div>`; 
                             contentAdded = true; 
                         } 
                         if (contentAdded) { 
                             dataFound = true; 
                             fallbackContentHtml += `<div class="metadata-block"><h4 class="metadata-title">其他 PNG 文本块 (Text Chunks)</h4><pre id="${pngTextId}" class="other-text-chunks-pre">${chunksPreContent}</pre></div>`; 
                         } 
                     }
                     // --- MODIFICATION END ---


                     // 4. Combine and Display Messages + Blocks
                     let messageHtml = '';
                     // Update LSB error messages
                     if (lsbError && !lsbError.message.toLowerCase().includes('magic number 不匹配') && !lsbError.message.toLowerCase().includes('非 png/webp')) {
                         messageHtml += `<div class="error-message">LSB 提取失败: ${escapeHtml(lsbError.message)}</div>`;
                     } else if (lsbError) { // Show info for expected non-LSB cases
                         const lsbErrorMsg = lsbError.message.toLowerCase();
                         const lsbSkipReason = lsbErrorMsg.includes('非 png/webp') ? '非PNG/WEBP文件' : 'Magic Number不匹配';
                         messageHtml += `<div class="info-message">未找到 LSB 隐写元数据 (${lsbSkipReason})。正在检查标准元数据...</div>`;
                     }
                     if (pngChunkError) { messageHtml += `<div class="error-message">PNG 块解析警告: ${escapeHtml(pngChunkError)}</div>`; }
                     if (fallbackError) { messageHtml += `<div class="error-message">回退处理错误: ${escapeHtml(fallbackError)}</div>`; }
                     // Update "not found" check
                     if (!dataFound && !fallbackError && !pngChunkError && !(lsbError && !lsbError.message.toLowerCase().includes('magic number 不匹配') && !lsbError.message.toLowerCase().includes('非 png/webp'))) {
                        messageHtml += `<div class="info-message">在此文件中未找到可识别的 LSB 或标准元数据。</div>`;
                     }

                     resultBlockContent.innerHTML = messageHtml + attemptedNaiFormatHtml + fallbackContentHtml;
                 }

            } catch (error) {
                console.error(`处理 ${file.name} 时发生严重错误:`, error);
                processingIndicator.style.display = 'none';
                resultBlockContent.innerHTML = `<div class="error-message"><strong class="font-bold">处理失败:</strong><span class="block sm:inline ml-1">${escapeHtml(error.message || "发生未知错误")}</span></div>`;
            } finally {
                processingCounter--; updateLoadingIndicator(); showClearButtonIfNeeded();
                 // Don't revoke objectURL here if it's used for preview; cleanup happens globally or on new file load
            }
        }

        // --- Display Global Error Function ---
        function displayError(message, filename = "未知文件", blockId = null) { /* ... (Error display logic - unchanged) ... */ const errorHtml = `<div class="error-message"><strong class="font-bold">错误:</strong><span class="block sm:inline ml-1">${escapeHtml(message)}</span></div>`; if (blockId) { let targetBlock = document.getElementById(blockId); if (targetBlock) { const content = targetBlock.querySelector('.result-content'); const indicator = targetBlock.querySelector('.processing-indicator'); if (indicator) indicator.style.display = 'none'; if (content) content.innerHTML = errorHtml; else targetBlock.innerHTML += errorHtml; } else { const errorDiv = document.createElement('div'); errorDiv.className = 'result-block'; errorDiv.innerHTML = `<div class="result-header"><span class="result-filename">${escapeHtml(filename)}</span></div>${errorHtml}`; resultsContainer.insertBefore(errorDiv, resultsContainer.firstChild); } } else { const errorDiv = document.createElement('div'); errorDiv.className = 'result-block'; errorDiv.innerHTML = `<div class="result-header"><span class="result-filename">${escapeHtml(filename)}</span></div>${errorHtml}`; resultsContainer.insertBefore(errorDiv, resultsContainer.firstChild); } if (processingCounter > 0) processingCounter--; updateLoadingIndicator(); showClearButtonIfNeeded(); }

        // --- Event Listeners (Added name check for pasted files) ---
        fileInput.addEventListener('change', (event) => { const files = event.target.files; if (files.length > 0) { cleanupPreviews(); // Clean up old previews before processing new files
             for (const file of files) { processFile(file); } } fileInput.value = ''; }); // Reset input
        dropZone.addEventListener('dragover', (event) => { event.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (event) => { event.preventDefault(); dropZone.classList.remove('dragover'); const files = event.dataTransfer.files; if (files.length > 0) { cleanupPreviews(); for (const file of files) { processFile(file); } } });
        document.addEventListener('paste', (event) => { console.log("Paste event detected."); const items = event.clipboardData?.items; if (!items) return; let foundImage = false; cleanupPreviews(); // Clean up old previews before processing pasted image
             for (const item of items) { if (item.kind === 'file' && ['image/png', 'image/jpeg', 'image/webp'].includes(item.type)) { const file = item.getAsFile(); if (file) { // Create a useful name if the pasted file doesn't have one
                 const defaultName = `Pasted_${Date.now()}.${file.type.split('/')[1] || 'png'}`; const pseudoName = file.name && file.name !== 'image.png' ? file.name : defaultName; const namedFile = new File([file], pseudoName, { type: file.type }); console.log(`Pasted image found: ${namedFile.name}, Type: ${namedFile.type}, Size: ${namedFile.size}`); processFile(namedFile); foundImage = true; break; // Process only the first valid image found
                 } } else if (item.kind === 'file' && item.type.startsWith('image/')) { console.warn("Pasted an unsupported image type:", item.type); displayError(`粘贴的图片格式 (${item.type}) 不支持。请使用 PNG, JPG, 或 WEBP。`, 'Pasted Image'); foundImage = true; break; // Stop after finding an unsupported image
                 } } if (foundImage) { event.preventDefault(); } else { console.log("No suitable image found in pasted items."); } });
        window.addEventListener('beforeunload', cleanupPreviews); // Clean up previews when leaving the page

    </script>
</body>
